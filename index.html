<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rythm Web Music & Video Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #121212; color: #ffffff; display: flex; justify-content: center; padding: 20px; }
    
    .dashboard { width: 100%; max-width: 800px; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 20px; color: #5865F2; text-align: center; font-size: 24px; }
    
    .input-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .input-group { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; outline: none; font-size: 14px; }
    input:focus { border-color: #5865F2; }
    
    button { padding: 12px 18px; background: #5865F2; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #4752c4; }
    .btn-secondary { background: #3a3a3a; }
    .btn-secondary:hover { background: #4a4a4a; }

    .section-title { margin: 15px 0 10px 0; font-size: 13px; color: #5865F2; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
    
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }

    .list-box { background: #2a2a2a; padding: 10px; border-radius: 6px; height: 220px; overflow-y: auto; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #3a3a3a; font-size: 12px; gap: 8px; }
    .item-card:last-child { border-bottom: none; }
    .item-card.active { background: #383a40; border-left: 4px solid #57F287; border-radius: 4px; }
    .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .player-controls { background: #282828; padding: 16px; border-radius: 8px; text-align: center; }
    .now-playing { margin-bottom: 12px; font-size: 14px; color: #57F287; font-weight: 500; }
    
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      margin-top: 10px;
    }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .btn-action { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; color: white; white-space: nowrap; }
    .btn-add { background: #5865F2; }
    .btn-play { background: #57F287; color: #000; }
    .btn-del { background: #ed4245; }
  </style>
</head>
<body>

<div class="dashboard">
  <h2>🎵 Rythm Web Dashboard</h2>
  
  <div class="input-section">
    <div class="input-group">
      <input type="text" id="linkInput" placeholder="🔗 Dán Link YouTube hoặc Video ID..." onkeypress="if(event.key==='Enter') addByLink()">
      <button onclick="addByLink()">+ Thêm Link</button>
    </div>
    
    <div class="input-group">
      <input type="text" id="keywordInput" placeholder="🔍 Nhập từ khóa tìm kiếm trực tiếp..." onkeypress="if(event.key==='Enter') searchByKeyword()">
      <button class="btn-secondary" onclick="searchByKeyword()">Tìm Kiếm</button>
    </div>
  </div>

  <div class="grid-container">
    <div>
      <div class="section-title" id="boxTitle">🔥 Đề Xuất Hot</div>
      <div class="list-box" id="suggestionsContainer"></div>
    </div>

    <div>
      <div class="section-title">📜 Hàng Chờ (Queue)</div>
      <div class="list-box" id="queueContainer">
        <div style="color:#777; text-align:center; padding: 20px;">Hàng chờ đang trống</div>
      </div>
    </div>
  </div>

  <div class="player-controls">
    <div class="now-playing" id="nowPlaying">Trạng thái: <b>Chưa chọn video</b></div>
    <div class="video-container">
      <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
  const suggestions = [
    { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up' },
    { id: 'jfKfPfyJRdk', title: 'Lofi Hip Hop Radio - Beats to Relax/Study' },
    { id: '3JZ_D3ELwOQ', title: 'Lofi Chill Beats Music 24/7' },
    { id: '5qap5aO4i9A', title: 'Lofi Girl - Sleep Radio' }
  ];

  let playlist = [];
  let currentTrack = -1;

  window.onload = () => {
    renderList('suggestionsContainer', suggestions, 'Đề Xuất Hot');
  };

  function parseYoutubeID(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : url.trim();
  }

  function addByLink() {
    const input = document.getElementById('linkInput');
    const val = input.value.trim();
    if (!val) return;
    const id = parseYoutubeID(val);
    addToQueue(id, `Video YouTube (${id})`);
    input.value = '';
  }

  // TÌM KIẾM TRỰC TIẾP RA KẾT QUẢ KHÔNG CẦN CHUYỂN TAB
  async function searchByKeyword() {
    const query = document.getElementById('keywordInput').value.trim();
    if (!query) return;

    const container = document.getElementById('suggestionsContainer');
    document.getElementById('boxTitle').innerText = `🔍 Kết quả: "${query}"`;
    container.innerHTML = '<div style="color:#aaa; text-align:center; padding: 20px;">Đang tìm kiếm...</div>';

    try {
      // Gọi qua API Invidious công khai để tìm kiếm video trực tiếp dạng JSON
      const response = await fetch(`https://invidious.jing.rocks/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
      const data = await response.json();

      if (!data || data.length === 0) {
        container.innerHTML = '<div style="color:#777; text-align:center; padding: 20px;">Không tìm thấy kết quả phù hợp</div>';
        return;
      }

      // Lọc lấy danh sách kết quả trả về
      const results = data.slice(0, 10).map(item => ({
        id: item.videoId,
        title: item.title
      }));

      // Hiển thị danh sách kết quả lên ô bên trái
      container.innerHTML = results.map(item => `
        <div class="item-card">
          <span class="item-title" title="${item.title}">${item.title}</span>
          <button class="btn-action btn-add" onclick="addToQueue('${item.id}', '${item.title.replace(/'/g, "\\'")}')">+ Hàng chờ</button>
        </div>
      `).join('');

    } catch (error) {
      container.innerHTML = '<div style="color:#f55; text-align:center; padding: 20px;">Lỗi tải kết quả tìm kiếm</div>';
    }
  }

  function renderList(containerId, items, title) {
    document.getElementById('boxTitle').innerText = title;
    const container = document.getElementById(containerId);
    container.innerHTML = items.map(item => `
      <div class="item-card">
        <span class="item-title" title="${item.title}">${item.title}</span>
        <button class="btn-action btn-add" onclick="addToQueue('${item.id}', '${item.title.replace(/'/g, "\\'")}')">+ Hàng chờ</button>
      </div>
    `).join('');
  }

  function addToQueue(id, title) {
    playlist.push({ id, title });
    renderQueue();
    if (playlist.length === 1 && currentTrack === -1) {
      playTrack(0);
    }
  }

  function renderQueue() {
    const container = document.getElementById('queueContainer');
    if (playlist.length === 0) {
      container.innerHTML = '<div style="color:#777; text-align:center; padding: 20px;">Hàng chờ đang trống</div>';
      return;
    }

    container.innerHTML = playlist.map((item, index) => `
      <div class="item-card ${index === currentTrack ? 'active' : ''}">
        <span class="item-title"><b>${index + 1}.</b> ${item.title}</span>
        <div>
          <button class="btn-action btn-play" onclick="playTrack(${index})">Phát</button>
          <button class="btn-action btn-del" onclick="removeTrack(${index})">Xóa</button>
        </div>
      </div>
    `).join('');
  }

  function playTrack(index) {
    if (!playlist[index]) return;
    currentTrack = index;
    renderQueue();
    
    const track = playlist[currentTrack];
    document.getElementById('nowPlaying').innerHTML = `Đang phát (${currentTrack + 1}/${playlist.length}): <b>${track.title}</b>`;
    document.getElementById('youtubePlayer').src = `https://www.youtube.com/embed/${track.id}?autoplay=1`;
  }

  function removeTrack(index) {
    playlist.splice(index, 1);
    if (index === currentTrack) {
      if (playlist.length > 0) {
        playTrack(Math.min(index, playlist.length - 1));
      } else {
        currentTrack = -1;
        document.getElementById('youtubePlayer').src = '';
        document.getElementById('nowPlaying').innerHTML = 'Trạng thái: <b>Chưa chọn video</b>';
      }
    } else if (index < currentTrack) {
      currentTrack--;
    }
    renderQueue();
  }
</script>

</body>
</html>
